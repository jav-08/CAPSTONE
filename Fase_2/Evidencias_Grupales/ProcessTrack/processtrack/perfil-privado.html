<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ProcessTrack — Perfil privado</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header id="navbar" class="navbar"></header>

  <main>
    <h1>Perfil</h1>

    <div class="profile-layout">
      <div class="chart-card">
        <div class="chart-placeholder"></div>
        <div class="chart-legend">
          <span><span class="legend-dot" style="background:#6f4fd9"></span>Cancelado</span>
          <span><span class="legend-dot" style="background:#7fe0c9"></span>Rechazado</span>
          <span><span class="legend-dot" style="background:#16305f"></span>En proceso</span>
          <span><span class="legend-dot" style="background:#3aa9d1"></span>Completado</span>
        </div>
      </div>

      <div>
        <h2>Información</h2>
        <div class="field field-with-edit">
          <div style="flex:1">
            <label>Nombre de empresa</label>
            <input type="text" placeholder="empresa" />
          </div>
          <span class="edit-icon">✎</span>
        </div>
        <div class="field field-with-edit">
          <div style="flex:1">
            <label>Dirección de correo electrónico</label>
            <input type="email" placeholder="email@ejemplo.com" />
          </div>
          <span class="edit-icon">✎</span>
        </div>
        <div class="field field-with-edit">
          <div style="flex:1">
            <label>Descripción</label>
            <textarea rows="4" placeholder="agregar una descripción"></textarea>
          </div>
          <span class="edit-icon">✎</span>
        </div>

        <hr class="section-divider" />
        <h2>Información privada</h2>
        <div class="field field-with-edit">
          <div style="flex:1">
            <label>Nombre de usuario</label>
            <input type="text" />
          </div>
          <span class="edit-icon">✎</span>
        </div>
        <div class="field field-with-edit">
          <div style="flex:1">
            <label>Contraseña</label>
            <input type="password" />
          </div>
          <span class="edit-icon">✎</span>
        </div>
      </div>

      <div>
        <h2>Contactos</h2>
        <div class="field field-with-edit">
          <div style="flex:1">
            <label>Contacto 1</label>
            <input type="text" />
          </div>
          <span class="edit-icon">✎</span>
        </div>
        <div class="field field-with-edit">
          <div style="flex:1">
            <label>Contacto 2</label>
            <input type="text" />
          </div>
          <span class="edit-icon">✎</span>
        </div>
        <div class="field field-with-edit">
          <div style="flex:1">
            <label>Contacto 3</label>
            <input type="text" />
          </div>
          <span class="edit-icon">✎</span>
        </div>
        <div class="field field-with-edit">
          <div style="flex:1">
            <label>Contacto 4</label>
            <input type="text" />
          </div>
          <span class="edit-icon">✎</span>
        </div>
        <hr class="section-divider" />
        <div class="field field-with-edit">
          <div style="flex:1">
            <label>Mermas estimadas</label>
            <input type="text" placeholder="X%" />
          </div>
          <span class="edit-icon">✎</span>
        </div>
        <a href="pedidos.html" class="history-link">Historial de pedidos</a>
      </div>
    </div>
  </main>

  <footer id="footer" class="site-footer"></footer>
  <script src="js/components.js"></script>
</body>
</html>

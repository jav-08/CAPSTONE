<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ProcessTrack — Iniciar sesión</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body class="login-page">
  <main>
    <span class="login-brand">ProcessTrack</span>
    <h1 style="border: none; margin-top: 40px;">Iniciar sesión</h1>

    <form class="card login-card" id="login-form">
      <div class="field">
        <label for="usuario">Nombre de usuario</label>
        <input type="text" id="usuario" placeholder="usuario" />
      </div>
      <div class="field">
        <label for="password">Contraseña</label>
        <input type="password" id="password" placeholder="contraseña" />
      </div>
      <a href="#" class="login-forgot">¿Olvidó su contraseña?</a>
      <button type="submit" class="btn btn-neutral">Siguiente</button>
      <div style="clear: both;"></div>
    </form>
  </main>

  <script>
    // De momento el login solo redirige; la validación real vendrá después.
    document.getElementById("login-form").addEventListener("submit", (e) => {
      e.preventDefault();
      window.location.href = "listado-empresas.html";
    });
  </script>
</body>
</html>
